<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d89aa8" />
  <title>I Am Safe To Love</title>
  <style>
    @font-face {
      font-family: "Feroniapi";
      src: url("./Feroniapi-MediumItalic.woff2") format("woff2");
      font-weight: 500;
      font-style: italic;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --paper: #fff6ef;
      --blush: #edbbc1;
      --rose: #c9798c;
      --berry: #8f4960;
      --ink: #744853;
      --white: #fffaf5;
    }

    @property --wash-a-x { syntax: "<percentage>"; inherits: false; initial-value: 13%; }
    @property --wash-a-y { syntax: "<percentage>"; inherits: false; initial-value: 12%; }
    @property --wash-b-x { syntax: "<percentage>"; inherits: false; initial-value: 84%; }
    @property --wash-b-y { syntax: "<percentage>"; inherits: false; initial-value: 16%; }
    @property --wash-c-x { syntax: "<percentage>"; inherits: false; initial-value: 20%; }
    @property --wash-c-y { syntax: "<percentage>"; inherits: false; initial-value: 78%; }
    @property --wash-a { syntax: "<color>"; inherits: false; initial-value: #fff6ee; }
    @property --wash-b { syntax: "<color>"; inherits: false; initial-value: #e995aa; }
    @property --wash-c { syntax: "<color>"; inherits: false; initial-value: #984e67; }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dca1ac;
    }

    button { font: inherit; }

    .screen {
      position: relative;
      isolation: isolate;
      width: 100vw;
      height: 100svh;
      min-height: 640px;
      overflow: hidden;
      color: var(--white);
      font-family: "Avenir Next", Avenir, sans-serif;
      background: #dda7b1;
    }

    .field,
    .orb,
    .glow,
    .shade,
    .grain {
      position: absolute;
      pointer-events: none;
    }

    .field {
      --wash-a-x: 13%;
      --wash-a-y: 12%;
      --wash-b-x: 84%;
      --wash-b-y: 16%;
      --wash-c-x: 20%;
      --wash-c-y: 78%;
      --wash-a: #fff6ee;
      --wash-b: #e995aa;
      --wash-c: #984e67;
      inset: -10%;
      z-index: -8;
      background:
        radial-gradient(circle at var(--wash-a-x) var(--wash-a-y), var(--wash-a) 0 8%, rgba(255,238,232,.58) 21%, transparent 39%),
        radial-gradient(circle at var(--wash-b-x) var(--wash-b-y), var(--wash-b) 0 10%, rgba(225,117,149,.36) 29%, transparent 49%),
        radial-gradient(circle at var(--wash-c-x) var(--wash-c-y), var(--wash-c) 0 9%, rgba(124,54,78,.31) 27%, transparent 47%),
        radial-gradient(circle at 78% 78%, #f7c5c7 0 10%, rgba(247,197,199,.31) 31%, transparent 49%),
        radial-gradient(circle at 50% 48%, #f2b7bf 0 14%, #cf8095 54%, #efaeb8 100%);
      filter: blur(18px) saturate(1.08);
      transform: scale(1.08);
      will-change: transform, filter;
    }

    .orb {
      z-index: -7;
      width: 76vw;
      height: 68vw;
      border-radius: 43% 57% 62% 38% / 51% 37% 63% 49%;
      filter: blur(16px);
      opacity: .6;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .orb::before,
    .orb::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .orb::before {
      inset: 8% 11% 14% 7%;
      border-radius: 62% 38% 48% 52% / 43% 58% 42% 57%;
      background:
        radial-gradient(circle at 71% 24%, rgba(255,255,255,.72) 0 4%, rgba(255,255,255,.18) 16%, transparent 34%),
        radial-gradient(circle at 22% 72%, rgba(255,255,255,.24) 0 5%, transparent 29%);
      filter: blur(5px);
    }

    .orb::after {
      inset: -8% -12% -14% -9%;
      border-radius: 37% 63% 44% 56% / 61% 39% 58% 42%;
      border-top: 12px solid rgba(255,255,255,.2);
      border-right: 22px solid rgba(255,255,255,.07);
      border-bottom: 30px solid rgba(255,255,255,.02);
      border-left: 8px solid rgba(255,255,255,.14);
      filter: blur(18px);
      opacity: .75;
    }

    .orb-a {
      top: -13%;
      left: -33%;
      background:
        radial-gradient(ellipse at 62% 36%, rgba(255,250,242,.95) 0 18%, rgba(255,237,232,.63) 39%, rgba(255,248,239,.12) 69%, transparent 82%);
      transform: rotate(-13deg);
    }

    .orb-b {
      top: 28%;
      right: -39%;
      border-radius: 57% 43% 36% 64% / 42% 61% 39% 58%;
      background:
        radial-gradient(ellipse at 35% 62%, rgba(246,157,178,.88) 0 16%, rgba(231,119,150,.48) 42%, rgba(244,151,171,.08) 71%, transparent 84%);
      transform: rotate(17deg);
    }

    .orb-c {
      bottom: -25%;
      left: -25%;
      border-radius: 39% 61% 55% 45% / 64% 42% 58% 36%;
      background:
        radial-gradient(ellipse at 58% 42%, rgba(145,70,96,.78) 0 17%, rgba(126,57,79,.42) 45%, rgba(126,57,79,.07) 72%, transparent 84%);
      transform: rotate(-21deg);
    }

    .glow {
      inset: 16% -44% 2%;
      z-index: -6;
      background:
        radial-gradient(ellipse at center,
          rgba(255,248,240,.92) 0 5%,
          rgba(248,210,210,.67) 20%,
          rgba(204,112,139,.24) 43%,
          transparent 68%);
      filter: blur(28px);
      transform: rotate(-12deg);
      will-change: transform, opacity;
    }

    .shade {
      inset: 0;
      z-index: -5;
      background:
        linear-gradient(180deg, rgba(89,43,58,.06), transparent 26%, transparent 72%, rgba(89,43,58,.13)),
        radial-gradient(ellipse at center, transparent 45%, rgba(89,43,58,.09));
    }

    .grain {
      inset: 0;
      z-index: 10;
      opacity: .28;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
    }

    .intro,
    .ritual,
    .complete {
      position: absolute;
      inset: 0;
    }

    .intro {
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 84px 24px 28px;
    }

    .brand {
      position: absolute;
      top: max(30px, env(safe-area-inset-top));
      margin: 0;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .3em;
      text-transform: uppercase;
      opacity: .82;
    }

    .intro-copy {
      width: min(84vw, 410px);
      margin-top: -3vh;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .24em;
      text-transform: uppercase;
      opacity: .76;
    }

    .affirmation {
      margin: 0;
      color: var(--white);
      font-family: "Feroniapi", "Snell Roundhand", "Apple Chancery", cursive;
      font-size: clamp(50px, 14vw, 72px);
      font-weight: 500;
      font-style: italic;
      line-height: .96;
      letter-spacing: -.04em;
      text-align: center;
      text-wrap: balance;
      text-shadow: 0 7px 30px rgba(85,38,53,.2);
    }

    .description {
      width: 240px;
      max-width: 74vw;
      margin: 24px auto 0;
      font-family: "Iowan Old Style", Baskerville, serif;
      font-size: 13px;
      font-style: italic;
      line-height: 1.55;
      opacity: .77;
    }

    .begin-wrap {
      position: absolute;
      right: 24px;
      bottom: max(56px, calc(env(safe-area-inset-bottom) + 46px));
      left: 24px;
      text-align: center;
    }

    .begin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 224px;
      max-width: calc(100vw - 48px);
      height: 58px;
      margin: 0 auto;
      border: 1px solid rgba(255,250,244,.62);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,248,241,.84);
      box-shadow: 0 18px 42px rgba(92,39,56,.16), inset 0 1px rgba(255,255,255,.82);
      backdrop-filter: blur(16px);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
    }

    .begin:focus-visible,
    .sound:focus-visible,
    .playback:focus-visible,
    .again:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 4px;
    }

    .meta {
      margin: 12px 0 0;
      font-size: 9px;
      letter-spacing: .16em;
      opacity: .68;
    }

    .ritual {
      z-index: 4;
      visibility: hidden;
      opacity: 0;
    }

    .ritual-center {
      position: absolute;
      top: 47%;
      left: 50%;
      width: min(88vw, 430px);
      transform: translate(-50%, -50%);
    }

    .ritual .affirmation {
      position: relative;
      will-change: opacity;
    }

    .brush-copy {
      position: absolute !important;
      inset: 0;
      z-index: 2;
      opacity: 0;
      filter: blur(3.2px);
      mask-image: linear-gradient(
        101deg,
        transparent 0%,
        transparent 35%,
        rgba(0,0,0,.28) 41%,
        #000 47%,
        rgba(0,0,0,.88) 54%,
        rgba(0,0,0,.22) 61%,
        transparent 67%,
        transparent 100%
      );
      mask-size: 300% 150%;
      mask-position: 100% 50%;
      -webkit-mask-image: linear-gradient(
        101deg,
        transparent 0%,
        transparent 35%,
        rgba(0,0,0,.28) 41%,
        #000 47%,
        rgba(0,0,0,.88) 54%,
        rgba(0,0,0,.22) 61%,
        transparent 67%,
        transparent 100%
      );
      -webkit-mask-size: 300% 150%;
      -webkit-mask-position: 100% 50%;
      pointer-events: none;
      will-change: opacity, mask-position, -webkit-mask-position, filter;
    }

    .sharp-copy {
      mask-image: linear-gradient(
        101deg,
        #000 0%,
        #000 34%,
        rgba(0,0,0,.72) 40%,
        transparent 47%,
        rgba(0,0,0,.12) 54%,
        rgba(0,0,0,.78) 61%,
        #000 68%,
        #000 100%
      );
      mask-size: 300% 150%;
      mask-position: 100% 50%;
      -webkit-mask-image: linear-gradient(
        101deg,
        #000 0%,
        #000 34%,
        rgba(0,0,0,.72) 40%,
        transparent 47%,
        rgba(0,0,0,.12) 54%,
        rgba(0,0,0,.78) 61%,
        #000 68%,
        #000 100%
      );
      -webkit-mask-size: 300% 150%;
      -webkit-mask-position: 100% 50%;
      will-change: mask-position, -webkit-mask-position;
    }

    .type-line {
      display: block;
      white-space: nowrap;
    }

    .type-char {
      display: inline-block;
      visibility: hidden;
      opacity: 0;
      will-change: opacity, filter, transform;
    }

    .countdown {
      position: absolute;
      bottom: max(31px, calc(env(safe-area-inset-bottom) + 21px));
      left: 50%;
      margin: 0;
      transform: translateX(-50%);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .2em;
      opacity: .76;
    }

    .sound,
    .playback {
      position: absolute;
      top: max(21px, env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255,250,244,.46);
      border-radius: 50%;
      color: var(--white);
      background: rgba(255,247,241,.12);
      backdrop-filter: blur(14px);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .sound { right: 18px; }
    .playback {
      top: auto;
      right: auto;
      bottom: max(61px, calc(env(safe-area-inset-bottom) + 51px));
      left: 50%;
      transform: translateX(-50%);
    }

    .sound svg,
    .playback svg {
      width: 17px;
      height: 17px;
      overflow: visible;
    }

    .sound .slash {
      opacity: 0;
    }

    .sound[aria-pressed="true"] .waves {
      opacity: 0;
    }

    .sound[aria-pressed="true"] .slash {
      opacity: 1;
    }

    .playback .play-icon {
      display: none;
    }

    .playback[aria-pressed="true"] .pause-icon {
      display: none;
    }

    .playback[aria-pressed="true"] .play-icon {
      display: block;
    }

    .complete {
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      padding: 24px;
      text-align: center;
      opacity: 0;
    }

    .complete-inner {
      width: min(82vw, 380px);
    }

    .complete h2 {
      margin: 0;
      font-family: "Feroniapi", "Snell Roundhand", "Apple Chancery", cursive;
      font-size: clamp(38px, 10.5vw, 52px);
      font-weight: 500;
      font-style: italic;
      line-height: 1.04;
      letter-spacing: -.035em;
      text-shadow: 0 6px 28px rgba(85,38,53,.18);
    }

    .complete p {
      margin: 17px 0 0;
      font-family: "Iowan Old Style", Baskerville, serif;
      font-size: 14px;
      font-style: italic;
      opacity: .78;
    }

    .again {
      margin-top: 34px;
      padding: 12px 18px;
      border: 0;
      color: var(--white);
      background: transparent;
      cursor: pointer;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      .field,
      .orb,
      .glow {
        will-change: auto;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="field" aria-hidden="true"></div>
    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>
    <div class="orb orb-c" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <section class="intro" aria-labelledby="intro-title">
      <p class="brand">Rose Quartz Ritual</p>
      <div class="intro-copy">
        <p class="eyebrow">A moment to return to yourself</p>
        <h1 class="affirmation" id="intro-title">I Am Safe<br />To Love</h1>
        <p class="description">Hold your stone close. Let your breath become soft.</p>
      </div>
      <div class="begin-wrap">
        <button class="begin" type="button">Begin</button>
        <p class="meta">20 seconds · sound on</p>
      </div>
    </section>

    <section class="ritual" aria-label="Affirmation ritual" aria-hidden="true">
      <button class="playback" type="button" aria-label="Pause ritual" aria-pressed="false">
        <svg class="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M9 7v10M15 7v10"></path>
        </svg>
        <svg class="play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 7 8 5-8 5V7Z"></path>
        </svg>
      </button>

      <button class="sound" type="button" aria-label="Turn sound off" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 10v4h3l4 3V7l-4 3H5Z"></path>
          <g class="waves">
            <path d="M15 9.2c1.3 1.55 1.3 4.05 0 5.6"></path>
            <path d="M18 6.8c2.7 2.9 2.7 7.5 0 10.4"></path>
          </g>
          <path class="slash" d="M4 4l16 16"></path>
        </svg>
      </button>

      <div class="ritual-center">
        <h1 class="affirmation sharp-copy">
          <span class="type-line">
            <span class="type-char">I</span><span class="type-char">&nbsp;</span><span class="type-char">A</span><span class="type-char">m</span><span class="type-char">&nbsp;</span><span class="type-char">S</span><span class="type-char">a</span><span class="type-char">f</span><span class="type-char">e</span>
          </span>
          <span class="type-line">
            <span class="type-char">T</span><span class="type-char">o</span><span class="type-char">&nbsp;</span><span class="type-char">L</span><span class="type-char">o</span><span class="type-char">v</span><span class="type-char">e</span>
          </span>
        </h1>
        <h1 class="affirmation brush-copy" aria-hidden="true">I Am Safe<br />To Love</h1>
      </div>
      <p class="countdown" aria-live="polite">00:20</p>
    </section>

    <section class="complete" aria-live="polite" aria-hidden="true">
      <div class="complete-inner">
        <h2>Let this feeling<br />stay with you.</h2>
        <p>Carry it gently into your day.</p>
        <button class="again" type="button">Begin again</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script>
    (() => {
      const DURATION = 20;
      const begin = document.querySelector(".begin");
      const intro = document.querySelector(".intro");
      const ritual = document.querySelector(".ritual");
      const complete = document.querySelector(".complete");
      const countdown = document.querySelector(".countdown");
      const soundButton = document.querySelector(".sound");
      const playbackButton = document.querySelector(".playback");
      const again = document.querySelector(".again");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let master;
      let audioContext;
      let masterGain;
      let musicBus;
      let musicTimer;
      let soundOff = false;
      let ritualPaused = false;
      let timer;
      let ending = false;

      function createAmbientSound() {
        if (audioContext) {
          audioContext.resume();
          return;
        }

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) {
          soundButton.hidden = true;
          return;
        }

        audioContext = new AudioCtx();
        masterGain = audioContext.createGain();
        masterGain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        masterGain.connect(audioContext.destination);

        const filter = audioContext.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 760;
        filter.Q.value = 0.5;
        musicBus = audioContext.createGain();
        musicBus.gain.value = 0.92;
        musicBus.connect(filter);
        filter.connect(masterGain);

        const delay = audioContext.createDelay(2);
        const delayFeedback = audioContext.createGain();
        const delayReturn = audioContext.createGain();
        delay.delayTime.value = 0.72;
        delayFeedback.gain.value = 0.28;
        delayReturn.gain.value = 0.24;
        delay.connect(delayFeedback);
        delayFeedback.connect(delay);
        delay.connect(delayReturn);
        delayReturn.connect(filter);
        musicBus.connect(delay);

        [110, 164.81, 220, 277.18].forEach((frequency, index) => {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = frequency;
          oscillator.detune.value = index === 1 ? -7 : index === 2 ? 4 : 0;
          gain.gain.value = index === 0 ? 0.046 : 0.015;
          oscillator.connect(gain);
          gain.connect(musicBus);
          oscillator.start();
        });

        const lfo = audioContext.createOscillator();
        const lfoGain = audioContext.createGain();
        lfo.type = "sine";
        lfo.frequency.value = 0.08;
        lfoGain.gain.value = 115;
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);
        lfo.start();
      }

      function playBell(frequency) {
        if (!audioContext || !musicBus || soundOff) return;
        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, now);
        oscillator.frequency.exponentialRampToValueAtTime(frequency * .997, now + 2.8);
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.14, now + .07);
        gain.gain.exponentialRampToValueAtTime(.0001, now + 3.4);
        oscillator.connect(gain);
        gain.connect(musicBus);
        oscillator.start(now);
        oscillator.stop(now + 3.5);
      }

      function startMelody() {
        window.clearInterval(musicTimer);
        const notes = [440, 554.37, 659.25, 554.37, 493.88];
        let noteIndex = 0;
        playBell(notes[noteIndex++]);
        musicTimer = window.setInterval(() => {
          playBell(notes[noteIndex % notes.length]);
          noteIndex += 1;
        }, 3600);
      }

      function fadeSound(value, duration = 1.4) {
        if (!masterGain || !audioContext) return;
        const now = audioContext.currentTime;
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(Math.max(masterGain.gain.value, 0.0001), now);
        masterGain.gain.exponentialRampToValueAtTime(Math.max(value, 0.0001), now + duration);
      }

      function updateCountdown() {
        const remaining = Math.max(0, Math.ceil(DURATION - master.time()));
        countdown.textContent = `00:${String(remaining).padStart(2, "0")}`;
        if (remaining === 0 && !ending) finish();
      }

      function finish() {
        if (ending) return;
        ending = true;
        window.clearInterval(timer);
        window.clearInterval(musicTimer);
        fadeSound(0.0001, 2);

        gsap.timeline()
          .to(".ritual .affirmation", {
            autoAlpha: 0,
            y: -8,
            filter: "blur(8px)",
            duration: reduceMotion ? 0 : 1.15,
            ease: "sine.inOut"
          })
          .to([".countdown", ".sound", ".playback"], {
            autoAlpha: 0,
            duration: reduceMotion ? 0 : 0.55
          }, "<")
          .set(ritual, { autoAlpha: 0 })
          .set(complete, { autoAlpha: 1 })
          .to(".complete-inner", {
            autoAlpha: 1,
            y: 0,
            filter: "blur(0px)",
            duration: reduceMotion ? 0 : 1.4,
            ease: "power2.out"
          })
          .call(() => {
            ritual.setAttribute("aria-hidden", "true");
            complete.setAttribute("aria-hidden", "false");
          });
      }

      function buildRitual() {
        master?.kill();
        gsap.killTweensOf([".field", ".glow", ".orb", ".ritual .affirmation", ".type-char", ".brush-copy", ".sharp-copy"]);
        const firstForward = Math.random() > .5;
        const secondForward = Math.random() > .5;
        const brushAStart = `${firstForward ? 100 : 0}% ${gsap.utils.random(35, 65)}%`;
        const brushAEnd = `${firstForward ? 0 : 100}% ${gsap.utils.random(35, 65)}%`;
        const brushBStart = `${secondForward ? 100 : 0}% ${gsap.utils.random(32, 68)}%`;
        const brushBEnd = `${secondForward ? 0 : 100}% ${gsap.utils.random(32, 68)}%`;

        gsap.set(complete, { autoAlpha: 0 });
        gsap.set(".complete-inner", { autoAlpha: 0, y: 14, filter: "blur(8px)" });
        gsap.set(ritual, { autoAlpha: 1 });
        gsap.set(".ritual .affirmation", {
          autoAlpha: 1,
          y: 0,
          filter: "blur(0px)"
        });
        gsap.set(".orb", { xPercent: 0, yPercent: 0, scale: 1, autoAlpha: .6 });
        gsap.set(".glow", { xPercent: 0, yPercent: 0, scale: 1, rotation: -12, autoAlpha: .3 });
        gsap.set(".field", {
          "--wash-a-x": "13%",
          "--wash-a-y": "12%",
          "--wash-b-x": "84%",
          "--wash-b-y": "16%",
          "--wash-c-x": "20%",
          "--wash-c-y": "78%",
          "--wash-a": "#fff6ee",
          "--wash-b": "#e995aa",
          "--wash-c": "#984e67"
        });
        gsap.set(".type-char", {
          autoAlpha: 0,
          filter: "blur(0px)"
        });
        gsap.set(".brush-copy", {
          autoAlpha: 0,
          filter: "blur(3.2px)",
          webkitMaskPosition: brushAStart,
          maskPosition: brushAStart
        });
        gsap.set(".sharp-copy", {
          webkitMaskPosition: brushAStart,
          maskPosition: brushAStart
        });
        gsap.set([".countdown", ".sound"], { autoAlpha: 1 });
        gsap.set(".playback", { autoAlpha: 1 });
        countdown.textContent = "00:20";

        master = gsap.timeline({
          paused: true,
          defaults: { ease: "sine.inOut" },
          onUpdate: updateCountdown
        });

        master
          .to(".ritual .affirmation", {
            autoAlpha: 1,
            duration: reduceMotion ? 0 : .25
          }, 0)
          .to(".type-char", {
            autoAlpha: 1,
            filter: "blur(0px)",
            duration: reduceMotion ? 0 : .18,
            stagger: reduceMotion ? 0 : {
              each: .09,
              from: "start"
            },
            ease: "power1.out"
          }, .55)
          .to(".brush-copy", {
            autoAlpha: .88,
            duration: .35,
            ease: "sine.out"
          }, 2.7)
          .to([".brush-copy", ".sharp-copy"], {
            webkitMaskPosition: brushAEnd,
            maskPosition: brushAEnd,
            duration: 4.2,
            ease: "sine.inOut"
          }, 2.7)
          .to(".brush-copy", {
            autoAlpha: 0,
            duration: .45,
            ease: "sine.in"
          }, 6.45)
          .set(".brush-copy", {
            webkitMaskPosition: brushBStart,
            maskPosition: brushBStart,
            filter: "blur(2.6px)"
          }, 11.1)
          .set(".sharp-copy", {
            webkitMaskPosition: brushBStart,
            maskPosition: brushBStart
          }, 11.1)
          .to(".brush-copy", {
            autoAlpha: .76,
            duration: .35,
            ease: "sine.out"
          }, 11.1)
          .to([".brush-copy", ".sharp-copy"], {
            webkitMaskPosition: brushBEnd,
            maskPosition: brushBEnd,
            duration: 4.4,
            ease: "sine.inOut"
          }, 11.1)
          .to(".brush-copy", {
            autoAlpha: 0,
            duration: .45,
            ease: "sine.in"
          }, 15.05)
          .to(".field", {
            "--wash-a-x": "36%",
            "--wash-a-y": "23%",
            "--wash-b-x": "70%",
            "--wash-b-y": "38%",
            "--wash-c-x": "34%",
            "--wash-c-y": "69%",
            "--wash-a": "#ffe1dc",
            "--wash-b": "#d95f88",
            "--wash-c": "#713149",
            duration: 5
          }, 0)
          .to(".field", {
            "--wash-a-x": "18%",
            "--wash-a-y": "42%",
            "--wash-b-x": "88%",
            "--wash-b-y": "20%",
            "--wash-c-x": "52%",
            "--wash-c-y": "84%",
            "--wash-a": "#fff8ef",
            "--wash-b": "#f0a5b4",
            "--wash-c": "#b25d78",
            duration: 5
          }, 5)
          .to(".field", {
            "--wash-a-x": "42%",
            "--wash-a-y": "16%",
            "--wash-b-x": "63%",
            "--wash-b-y": "55%",
            "--wash-c-x": "16%",
            "--wash-c-y": "64%",
            "--wash-a": "#ffd5d2",
            "--wash-b": "#c94f79",
            "--wash-c": "#692b43",
            duration: 5
          }, 10)
          .to(".field", {
            "--wash-a-x": "13%",
            "--wash-a-y": "12%",
            "--wash-b-x": "84%",
            "--wash-b-y": "16%",
            "--wash-c-x": "20%",
            "--wash-c-y": "78%",
            "--wash-a": "#fff6ee",
            "--wash-b": "#e995aa",
            "--wash-c": "#984e67",
            duration: 5
          }, 15)
          .to(".field", {
            scale: reduceMotion ? 1.13 : 1.2,
            rotation: reduceMotion ? 0 : 2,
            duration: 5
          }, 0)
          .to(".glow", {
            scale: reduceMotion ? 1 : 1.1,
            rotation: reduceMotion ? -12 : -9,
            autoAlpha: reduceMotion ? .55 : .38,
            duration: 5
          }, 0)
          .to(".orb-a", {
            scale: reduceMotion ? 1 : 1.12,
            rotation: reduceMotion ? -13 : -7,
            autoAlpha: reduceMotion ? .6 : .72,
            duration: 5
          }, 0)
          .to(".orb-b", {
            scale: reduceMotion ? 1 : 1.09,
            rotation: reduceMotion ? 17 : 11,
            autoAlpha: reduceMotion ? .6 : .72,
            duration: 5
          }, 0)
          .to(".orb-c", {
            scale: reduceMotion ? 1 : 1.07,
            rotation: reduceMotion ? -21 : -15,
            autoAlpha: reduceMotion ? .6 : .7,
            duration: 5
          }, 0)
          .to(".field", { scale: 1.12, rotation: -1.5, duration: 5 }, 5)
          .to(".glow", { scale: .96, rotation: -14, autoAlpha: .24, duration: 5 }, 5)
          .to(".orb-a", { scale: .96, rotation: -17, autoAlpha: .52, duration: 5 }, 5)
          .to(".orb-b", { scale: .95, rotation: 20, autoAlpha: .5, duration: 5 }, 5)
          .to(".orb-c", { scale: 1.02, rotation: -24, autoAlpha: .58, duration: 5 }, 5)
          .to(".field", { scale: 1.2, rotation: 1.5, duration: 5 }, 10)
          .to(".glow", { scale: 1.09, rotation: -10, autoAlpha: .36, duration: 5 }, 10)
          .to(".orb-a", { scale: 1.1, rotation: -8, autoAlpha: .7, duration: 5 }, 10)
          .to(".orb-b", { scale: 1.08, rotation: 12, autoAlpha: .69, duration: 5 }, 10)
          .to(".orb-c", { scale: 1.06, rotation: -16, autoAlpha: .68, duration: 5 }, 10)
          .to(".field", { scale: 1.13, rotation: 0, duration: 5 }, 15)
          .to(".glow", { scale: 1, rotation: -12, autoAlpha: .3, duration: 5 }, 15)
          .to(".orb-a", { scale: 1, rotation: -13, autoAlpha: .6, duration: 5 }, 15)
          .to(".orb-b", { scale: 1, rotation: 17, autoAlpha: .6, duration: 5 }, 15)
          .to(".orb-c", { scale: 1, rotation: -21, autoAlpha: .6, duration: 5 }, 15);
      }

      function startRitual() {
        if (!window.gsap) return;
        createAmbientSound();
        soundOff = false;
        ritualPaused = false;
        playbackButton.setAttribute("aria-pressed", "false");
        playbackButton.setAttribute("aria-label", "Pause ritual");
        soundButton.setAttribute("aria-pressed", "false");
        soundButton.setAttribute("aria-label", "Turn sound off");
        startMelody();
        fadeSound(0.28, 1.8);
        ending = false;
        ritualPaused = false;

        buildRitual();
        intro.setAttribute("aria-hidden", "true");
        ritual.setAttribute("aria-hidden", "false");
        complete.setAttribute("aria-hidden", "true");

        gsap.timeline({
          onComplete: () => {
            master.play(0);
            timer = window.setInterval(updateCountdown, 200);
          }
        })
          .to(".intro-copy", {
            autoAlpha: 0,
            y: -10,
            filter: "blur(8px)",
            duration: reduceMotion ? 0 : .65,
            ease: "power2.in"
          })
          .to([".brand", ".begin-wrap"], {
            autoAlpha: 0,
            duration: reduceMotion ? 0 : .5,
            ease: "power2.in"
          }, "<")
          .set(intro, { autoAlpha: 0 })
          .fromTo(".ritual .affirmation",
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: reduceMotion ? 0 : .35, ease: "sine.out" }
          );
      }

      function reset() {
        window.clearInterval(timer);
        window.clearInterval(musicTimer);
        fadeSound(0.0001, .8);
        ending = false;
        master?.kill();
        gsap.set(complete, { autoAlpha: 0 });
        gsap.set(ritual, { autoAlpha: 0 });
        gsap.set(intro, { autoAlpha: 1 });
        gsap.set([".intro-copy", ".brand", ".begin-wrap"], {
          clearProps: "all"
        });
        intro.setAttribute("aria-hidden", "false");
        ritual.setAttribute("aria-hidden", "true");
        complete.setAttribute("aria-hidden", "true");
      }

      begin.addEventListener("click", startRitual);
      again.addEventListener("click", reset);

      soundButton.addEventListener("click", () => {
        soundOff = !soundOff;
        soundButton.setAttribute("aria-pressed", String(soundOff));
        soundButton.setAttribute("aria-label", soundOff ? "Turn sound on" : "Turn sound off");
        fadeSound(soundOff ? 0.0001 : 0.28, .5);
      });

      playbackButton.addEventListener("click", () => {
        if (!master || ending) return;
        ritualPaused = !ritualPaused;
        playbackButton.setAttribute("aria-pressed", String(ritualPaused));
        playbackButton.setAttribute("aria-label", ritualPaused ? "Continue ritual" : "Pause ritual");

        if (ritualPaused) {
          master.pause();
          window.clearInterval(musicTimer);
          fadeSound(0.0001, .35);
        } else {
          master.play();
          if (!soundOff) {
            startMelody();
            fadeSound(.28, .55);
          }
        }
      });
    })();
  </script>
</body>
</html>
