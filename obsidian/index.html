<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080a0b" />
  <title>I Stand In My Truth</title>
  <style>
    @font-face{font-family:Dokdo;src:url("./Dokdo-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080a0b}
    body{color:#eef0ed;font-family:"Avenir Next",Avenir,"Helvetica Neue",sans-serif}
    button{font:inherit}
    .screen{position:relative;isolation:isolate;width:100vw;height:100svh;min-height:620px;overflow:hidden;background:#090b0c}
    .base,.wash-field,.wash,.mineral,.grain,.shade{position:absolute;inset:0;pointer-events:none}
    .base{z-index:-6;background:linear-gradient(154deg,#596064 0%,#262b2e 28%,#3e4548 53%,#15191b 77%,#474e51 100%)}
    .wash-field{z-index:-5;inset:-25%;overflow:hidden;filter:blur(8px) saturate(.78);transform:scale(1.06)}
    .wash{inset:-12%;will-change:transform,opacity;background-repeat:no-repeat}
    .wash-a{transform:scale(1.05);background:radial-gradient(ellipse 72% 62% at 20% 18%,rgba(226,228,226,.72) 0%,rgba(170,176,177,.5) 24%,rgba(91,98,101,.18) 51%,transparent 74%),radial-gradient(ellipse 56% 76% at 80% 78%,rgba(171,176,177,.44) 0%,rgba(74,80,83,.2) 48%,transparent 75%)}
    .wash-b{transform:scale(1.08);opacity:.9;background:radial-gradient(ellipse 63% 55% at 84% 20%,rgba(29,34,36,.86) 0%,rgba(61,68,71,.52) 30%,rgba(116,122,124,.16) 57%,transparent 78%),radial-gradient(ellipse 74% 50% at 30% 86%,rgba(207,210,209,.52) 0%,rgba(125,131,133,.28) 34%,rgba(39,44,46,.12) 65%,transparent 82%)}
    .wash-c{transform:scale(1);background:radial-gradient(ellipse 52% 68% at 48% 53%,rgba(190,195,195,.38) 0%,rgba(104,111,113,.22) 38%,transparent 73%),linear-gradient(132deg,rgba(222,224,222,.12),transparent 36%,rgba(18,22,23,.32) 61%,rgba(178,183,183,.16));mix-blend-mode:screen;opacity:.72}
    .mineral{display:none}
    .sheet{transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
    .sheet path{filter:url(#soft-edge) blur(3px)}
    .seam{fill:none;stroke:#d9dcda;stroke-width:.22;stroke-opacity:.38;filter:url(#seam-glow);vector-effect:non-scaling-stroke}
    .grain{z-index:7;opacity:.28;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E")}
    .shade{z-index:-2;background:radial-gradient(ellipse at 50% 47%,transparent 18%,rgba(0,0,0,.12) 64%,rgba(0,0,0,.36) 115%)}
    .intro,.ritual,.complete{position:absolute;inset:0}
    .intro{z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:88px 26px 30px;text-align:center}
    .brand-lockup{position:fixed;z-index:9;top:max(25px,calc(env(safe-area-inset-top) + 10px));left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
    .logo{display:block;width:58px;height:auto;margin:0 auto 18px;opacity:.94}
    .ritual-name{margin:0;font-size:8px;font-weight:500;letter-spacing:.37em;text-indent:.37em;text-transform:uppercase;opacity:.68}
    .intro-copy{width:min(84vw,390px);margin-top:-2vh}
    .affirmation{margin:0;font-family:Dokdo,"Segoe Print","Bradley Hand",cursive;font-size:clamp(58px,17vw,84px);font-weight:400;line-height:.78;letter-spacing:.01em;text-shadow:0 4px 25px rgba(255,255,255,.08)}
    .description{margin:34px auto 0;max-width:290px;font-family:"Iowan Old Style",Baskerville,serif;font-size:13px;font-style:italic;line-height:1.55;letter-spacing:.01em;opacity:.64}
    .begin-wrap{position:absolute;bottom:max(35px,calc(env(safe-area-inset-bottom) + 23px));left:50%;transform:translateX(-50%)}
    .begin{width:224px;height:58px;border:1px solid rgba(238,240,237,.5);border-radius:0;color:#eef0ed;background:rgba(10,12,13,.15);cursor:pointer;font-size:10px;font-weight:500;letter-spacing:.38em;text-indent:.38em;text-transform:uppercase}
    .meta{margin:16px 0 0;font-size:8px;letter-spacing:.25em;opacity:.48;white-space:nowrap}
    .ritual{z-index:4;visibility:hidden;opacity:0}
    .ritual-center{position:absolute;top:50%;left:50%;width:min(86vw,420px);transform:translate(-50%,-51%);text-align:center}
    .ritual-copy{position:relative;filter:drop-shadow(0 0 10px rgba(235,239,238,.08))}
    .type-line{display:block}.type-char{display:inline-block;will-change:filter,opacity}
    .blur-trace{position:absolute;z-index:3;inset:0;margin:0;pointer-events:none;opacity:0;filter:url(#brush-warp) blur(3.2px);will-change:clip-path,opacity}
    .trace-a{clip-path:polygon(0 17%,0 17%,0 17%,0 17%,0 17%,0 17%,0 17%,0 17%,0 17%,0 17%)}
    .trace-b{clip-path:polygon(42% 0,42% 0,42% 0,42% 0,42% 0,42% 0,42% 0,42% 0,42% 0,42% 0)}
    .trace-c{clip-path:polygon(100% 28%,100% 28%,100% 28%,100% 28%,100% 28%,100% 28%,100% 28%,100% 28%,100% 28%,100% 28%)}
    .countdown{position:absolute;left:50%;bottom:max(25px,calc(env(safe-area-inset-bottom) + 16px));margin:0;transform:translateX(-50%);font-size:10px;letter-spacing:.25em;font-variant-numeric:tabular-nums}
    .icon-button{position:absolute;display:grid;place-items:center;width:52px;height:52px;border:1px solid rgba(238,240,237,.28);border-radius:50%;color:#eef0ed;background:rgba(8,10,11,.08);cursor:pointer}
    .icon-button svg{width:18px;height:18px}.sound{top:max(25px,calc(env(safe-area-inset-top) + 10px));right:22px}.playback{left:50%;bottom:max(55px,calc(env(safe-area-inset-bottom) + 46px));transform:translateX(-50%)}
    .sound .slash{display:none}.sound[aria-pressed="true"] .waves{display:none}.sound[aria-pressed="true"] .slash{display:block}.play-icon{display:none}.playback[aria-pressed="true"] .pause-icon{display:none}.playback[aria-pressed="true"] .play-icon{display:block}
    .complete{z-index:5;display:flex;align-items:center;justify-content:center;visibility:hidden;padding:28px;text-align:center;opacity:0}
    .complete-inner{width:min(84vw,390px)}
    .complete h2{margin:0;font-family:Dokdo,"Segoe Print",cursive;font-size:clamp(52px,15vw,76px);font-weight:400;line-height:.82}
    .complete p{margin:28px 0 0;font-family:"Iowan Old Style",Baskerville,serif;font-size:13px;font-style:italic;opacity:.62}
    .again{margin-top:34px;padding:12px 18px;border:0;color:#eef0ed;background:transparent;cursor:pointer;font-size:9px;letter-spacing:.28em;text-transform:uppercase}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.blur-trace{display:none}}
  </style>
</head>
<body>
<main class="screen">
  <div class="base" aria-hidden="true"></div>
  <div class="wash-field" aria-hidden="true"><div class="wash wash-a"></div><div class="wash wash-b"></div><div class="wash wash-c"></div></div>
  <svg class="mineral" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <filter id="soft-edge" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency=".011 .026" numOctaves="3" seed="14" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="B"/>
        <feGaussianBlur stdDeviation=".5"/>
      </filter>
      <filter id="seam-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation=".35"/></filter>
      <filter id="brush-warp" x="-20%" y="-30%" width="140%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".018 .085" numOctaves="2" seed="27" result="brushNoise"/><feDisplacementMap in="SourceGraphic" in2="brushNoise" scale="9" xChannelSelector="R" yChannelSelector="B"/></filter>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#555b5e" stop-opacity=".5"/><stop offset=".55" stop-color="#202426" stop-opacity=".28"/><stop offset="1" stop-color="#090b0c" stop-opacity=".06"/></linearGradient>
      <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#81878a" stop-opacity=".25"/><stop offset=".45" stop-color="#303538" stop-opacity=".36"/><stop offset="1" stop-color="#0a0c0d" stop-opacity=".08"/></linearGradient>
      <linearGradient id="g3" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#111415" stop-opacity=".15"/><stop offset=".62" stop-color="#656b6e" stop-opacity=".32"/><stop offset="1" stop-color="#171a1c" stop-opacity=".18"/></linearGradient>
    </defs>
    <g class="sheet sheet-a"><path fill="url(#g1)" d="M-18-8C8 1 10 17 29 25c17 8 15 20 1 31C14 69 22 87 48 111H-18Z"/><path class="seam" d="M-14-2C7 5 9 18 29 26c17 7 14 20 1 31-14 12-8 29 18 50"/></g>
    <g class="sheet sheet-b"><path fill="url(#g2)" d="M76-12c-8 17-2 29 12 37 16 10 15 23-2 34-18 12-21 27-2 54h39V-12Z"/><path class="seam" d="M78-9c-9 18-1 29 12 37 14 10 13 22-3 33-17 12-20 27-2 51"/></g>
    <g class="sheet sheet-c"><path fill="url(#g3)" d="M-13 74c20-9 35-5 44 8 10 15 27 17 42 3 15-14 32-10 46 9v26H-13Z"/><path class="seam" d="M-10 75c20-9 33-4 42 9 11 14 27 16 42 2 15-13 29-9 44 8"/></g>
  </svg>
  <div class="shade" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>

  <section class="intro" aria-labelledby="intro-title">
    <div class="brand-lockup intro-brand"><img class="logo" src="KOVA.svg" alt="KOVA"/><p class="ritual-name">Black Obsidian Ritual</p></div>
    <div class="intro-copy"><h1 class="affirmation" id="intro-title">I Stand<br/>In My<br/>Truth</h1><p class="description">Hold your stone. Let what is true become clear.</p></div>
    <div class="begin-wrap"><button class="begin" type="button">Begin</button><p class="meta">20 seconds · sound on</p></div>
  </section>

  <section class="ritual" aria-label="Affirmation ritual" aria-hidden="true">
    <button class="icon-button sound" type="button" aria-label="Turn sound off" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 10v4h3l4 3V7l-4 3H5Z"/><g class="waves"><path d="M15 9.2c1.3 1.55 1.3 4.05 0 5.6"/><path d="M18 6.8c2.7 2.9 2.7 7.5 0 10.4"/></g><path class="slash" d="M4 4l16 16"/></svg></button>
    <div class="ritual-center"><div class="ritual-copy"><h1 class="affirmation sharp-copy"><span class="type-line"><span class="type-char">I</span><span class="type-char">&nbsp;</span><span class="type-char">S</span><span class="type-char">t</span><span class="type-char">a</span><span class="type-char">n</span><span class="type-char">d</span></span><span class="type-line"><span class="type-char">I</span><span class="type-char">n</span><span class="type-char">&nbsp;</span><span class="type-char">M</span><span class="type-char">y</span></span><span class="type-line"><span class="type-char">T</span><span class="type-char">r</span><span class="type-char">u</span><span class="type-char">t</span><span class="type-char">h</span></span></h1><h1 class="affirmation blur-trace trace-a" aria-hidden="true">I Stand<br/>In My<br/>Truth</h1><h1 class="affirmation blur-trace trace-b" aria-hidden="true">I Stand<br/>In My<br/>Truth</h1><h1 class="affirmation blur-trace trace-c" aria-hidden="true">I Stand<br/>In My<br/>Truth</h1></div></div>
    <button class="icon-button playback" type="button" aria-label="Pause ritual" aria-pressed="false"><svg class="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 7v10M15 7v10"/></svg><svg class="play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9 7 8 5-8 5V7Z"/></svg></button>
    <p class="countdown" aria-live="polite">00:20</p>
  </section>

  <section class="complete" aria-live="polite" aria-hidden="true">
    <div class="brand-lockup"><img class="logo" src="KOVA.svg" alt="KOVA"/><p class="ritual-name">Black Obsidian Ritual</p></div>
    <div class="complete-inner"><h2>Keep what is true<br/>close to you.</h2><p>Move forward with quiet certainty.</p><button class="again" type="button">Begin again</button></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
(()=>{
  const DURATION=20,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const intro=document.querySelector('.intro'),ritual=document.querySelector('.ritual'),complete=document.querySelector('.complete');
  const begin=document.querySelector('.begin'),again=document.querySelector('.again'),sound=document.querySelector('.sound'),playback=document.querySelector('.playback'),countdown=document.querySelector('.countdown');
  let master,scene,timer,audio,gain,melodyTimer,paused=false,muted=false,ending=false;
  function audioStart(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();gain=audio.createGain();gain.gain.value=.0001;gain.connect(audio.destination)}audio.resume();gain.gain.cancelScheduledValues(audio.currentTime);gain.gain.exponentialRampToValueAtTime(.2,audio.currentTime+1.4);tone(110,.015,4,'sine');tone(165,.01,5,'sine');clearInterval(melodyTimer);melodyTimer=setInterval(()=>tone([220,247,196,165][Math.floor(Math.random()*4)],.025,2.8,'sine'),3600)}
  function tone(freq,vol,dur,type){if(!audio||muted)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(vol,audio.currentTime+.7);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g);g.connect(gain);o.start();o.stop(audio.currentTime+dur+.1)}
  function fade(v,d=.4){if(!gain)return;gain.gain.cancelScheduledValues(audio.currentTime);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,v),audio.currentTime+d)}
  function update(){if(!master)return;const left=Math.max(0,Math.ceil(DURATION-master.time()));countdown.textContent=`00:${String(left).padStart(2,'0')}`}
  function finish(){if(ending)return;ending=true;clearInterval(timer);clearInterval(melodyTimer);fade(.0001,.8);scene?.kill();scene=gsap.timeline().to([ritual,'.ritual-copy'],{autoAlpha:0,duration:.65}).set(ritual,{visibility:'hidden'}).set(complete,{visibility:'visible',autoAlpha:1}).fromTo('.complete-inner',{autoAlpha:0,y:12,filter:'blur(6px)'},{autoAlpha:1,y:0,filter:'blur(0px)',duration:1,ease:'power2.out'});complete.setAttribute('aria-hidden','false')}
  function build(){
    master?.kill();
    gsap.killTweensOf(['.wash','.type-char','.blur-trace']);
    gsap.set('.mineral',{scale:1.04,rotation:0});
    gsap.set('.sheet',{xPercent:0,yPercent:0,scale:1,rotation:0,autoAlpha:1});
    gsap.set('.wash-a',{xPercent:0,yPercent:0,scale:1.05,rotation:0,autoAlpha:1});
    gsap.set('.wash-b',{xPercent:0,yPercent:0,scale:1.08,rotation:0,autoAlpha:.9});
    gsap.set('.wash-c',{xPercent:0,yPercent:0,scale:1,rotation:0,autoAlpha:.72});
    gsap.set('.type-char',{autoAlpha:0,filter:'blur(7px)'});
    gsap.set('.blur-trace',{autoAlpha:0});
    gsap.set('.trace-a',{clipPath:'polygon(0% 17%,0% 17%,0% 17%,0% 17%,0% 17%,0% 17%,0% 17%,0% 17%,0% 17%,0% 17%)'});
    gsap.set('.trace-b',{clipPath:'polygon(42% 0%,42% 0%,42% 0%,42% 0%,42% 0%,42% 0%,42% 0%,42% 0%,42% 0%,42% 0%)'});
    gsap.set('.trace-c',{clipPath:'polygon(100% 28%,100% 28%,100% 28%,100% 28%,100% 28%,100% 28%,100% 28%,100% 28%,100% 28%,100% 28%)'});
    master=gsap.timeline({paused:true,defaults:{ease:'sine.inOut'},onUpdate:update,onComplete:finish})
      .to('.type-char',{autoAlpha:1,filter:'blur(0px)',duration:reduce?0:.3,stagger:reduce?0:.11,ease:'power1.out'},.35)
      .to('.wash-a',{xPercent:13,yPercent:-9,scale:1.18,rotation:2.2,duration:6},0)
      .to('.wash-b',{xPercent:-12,yPercent:11,scale:1.2,rotation:-2.4,autoAlpha:1,duration:6},0)
      .to('.wash-c',{xPercent:7,yPercent:8,scale:1.14,rotation:1.5,autoAlpha:.9,duration:6},0)
      .to('.sheet-a',{xPercent:3,yPercent:-2,scale:1.03,rotation:.6,duration:6},0)
      .to('.sheet-b',{xPercent:-3,yPercent:3,scale:1.04,rotation:-.7,duration:6},0)
      .to('.trace-a',{autoAlpha:.78,duration:.2},4.1)
      .to('.trace-a',{clipPath:'polygon(0% 17%,24% 7%,57% 25%,100% 8%,100% 23%,64% 39%,28% 22%,0% 31%,0% 27%,18% 14%)',duration:2.4,ease:'sine.inOut'},4.1)
      .to('.trace-b',{autoAlpha:.72,duration:.2},4.8)
      .to('.trace-b',{clipPath:'polygon(42% 0%,57% 0%,50% 24%,63% 46%,51% 68%,60% 100%,44% 100%,38% 72%,48% 48%,36% 25%)',duration:2.8,ease:'sine.inOut'},4.8)
      .to('.trace-c',{autoAlpha:.7,duration:.2},5.6)
      .to('.trace-c',{clipPath:'polygon(100% 28%,88% 18%,72% 35%,79% 54%,63% 72%,74% 100%,91% 100%,82% 75%,94% 57%,84% 40%)',duration:2.5,ease:'sine.inOut'},5.6)
      .to('.blur-trace',{autoAlpha:0,duration:1.15,ease:'sine.inOut'},7.25)
      .to('.wash-a',{xPercent:-10,yPercent:13,scale:1.28,rotation:-2.8,duration:7},6)
      .to('.wash-b',{xPercent:14,yPercent:-12,scale:1.12,rotation:2.7,autoAlpha:.78,duration:7},6)
      .to('.wash-c',{xPercent:-8,yPercent:-9,scale:1.22,rotation:-1.8,autoAlpha:.7,duration:7},6)
      .to('.sheet-c',{xPercent:-2,yPercent:3,scale:1.04,rotation:-.8,duration:7},6)
      .to('.trace-c',{autoAlpha:.64,duration:.25},11.2)
      .to('.trace-c',{clipPath:'polygon(100% 28%,88% 18%,72% 35%,79% 54%,63% 72%,74% 100%,91% 100%,82% 75%,94% 57%,84% 40%)',duration:2.7,ease:'sine.inOut'},11.2)
      .to('.trace-a',{autoAlpha:.7,duration:.25},11.9)
      .to('.trace-a',{clipPath:'polygon(0% 17%,24% 7%,57% 25%,100% 8%,100% 23%,64% 39%,28% 22%,0% 31%,0% 27%,18% 14%)',duration:3,ease:'sine.inOut'},11.9)
      .to('.trace-b',{autoAlpha:.68,duration:.25},12.7)
      .to('.trace-b',{clipPath:'polygon(42% 0%,57% 0%,50% 24%,63% 46%,51% 68%,60% 100%,44% 100%,38% 72%,48% 48%,36% 25%)',duration:2.8,ease:'sine.inOut'},12.7)
      .to('.blur-trace',{autoAlpha:0,duration:1.1,ease:'sine.inOut'},14.8)
      .to('.wash-a',{xPercent:0,yPercent:0,scale:1.05,rotation:0,duration:7},13)
      .to('.wash-b',{xPercent:0,yPercent:0,scale:1.08,rotation:0,autoAlpha:.9,duration:7},13)
      .to('.wash-c',{xPercent:0,yPercent:0,scale:1,rotation:0,autoAlpha:.72,duration:7},13)
      .to('.sheet',{xPercent:0,yPercent:0,scale:1,rotation:0,duration:7},13);
  }
  function start(){if(!window.gsap)return;scene?.kill();clearInterval(timer);audioStart();paused=muted=ending=false;sound.setAttribute('aria-pressed','false');playback.setAttribute('aria-pressed','false');build();intro.setAttribute('aria-hidden','true');ritual.setAttribute('aria-hidden','false');complete.setAttribute('aria-hidden','true');gsap.set(complete,{autoAlpha:0,visibility:'hidden'});scene=gsap.timeline({onComplete:()=>{master.play(0);timer=setInterval(update,200)}}).to(['.intro-copy','.intro-brand','.begin-wrap'],{autoAlpha:0,filter:'blur(7px)',duration:.6,ease:'power2.in'}).set(intro,{autoAlpha:0,visibility:'hidden'}).set(ritual,{autoAlpha:1,visibility:'visible'});}
  function reset(){clearInterval(timer);clearInterval(melodyTimer);fade(.0001,.5);scene?.kill();master?.kill();gsap.killTweensOf([intro,ritual,complete,'.intro-copy','.intro-brand','.begin-wrap','.complete-inner','.ritual-copy','.type-char','.blur-trace']);ending=paused=false;gsap.set([complete,ritual],{autoAlpha:0,visibility:'hidden'});gsap.set(intro,{autoAlpha:1,visibility:'visible'});gsap.set(['.intro-copy','.intro-brand','.begin-wrap','.complete-inner','.ritual-copy'],{clearProps:'all'});gsap.set('.type-char',{clearProps:'all'});gsap.set('.blur-trace',{autoAlpha:0});countdown.textContent='00:20';intro.setAttribute('aria-hidden','false');ritual.setAttribute('aria-hidden','true');complete.setAttribute('aria-hidden','true')}
  begin.addEventListener('click',start);again.addEventListener('click',reset);
  sound.addEventListener('click',()=>{muted=!muted;sound.setAttribute('aria-pressed',String(muted));sound.setAttribute('aria-label',muted?'Turn sound on':'Turn sound off');fade(muted?.0001:.2,.35)});
  playback.addEventListener('click',()=>{if(!master||ending)return;paused=!paused;playback.setAttribute('aria-pressed',String(paused));playback.setAttribute('aria-label',paused?'Continue ritual':'Pause ritual');paused?(master.pause(),fade(.0001,.25)):(master.resume(),fade(muted?.0001:.2,.35))});
})();
</script>
</body>
</html>
